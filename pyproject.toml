[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eco"
version = "1.0.0"
description = "Unified system update manager for Arch Linux (pacman, AUR, flatpak, git)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "k4runa" }]
keywords = ["arch", "pacman", "aur", "flatpak", "update", "cli"]
dependencies = ["rich>=13.0"]

[project.urls]
Homepage = "https://github.com/k4runa/eco"

[project.scripts]
eco = "eco.cli:main"

[tool.setuptools]
packages = ["eco", "eco.sources"]
